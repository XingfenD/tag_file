{{define "sharedJS"}}
<script>
function flashMsg(el, msg, duration) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'inline-block';
    setTimeout(function() { el.style.display = 'none'; }, duration || 3000);
}

function confirmAction(msg) {
    return confirm(msg);
}

function setupTagSearch(input, dropdown, onInput) {
    input = typeof input === 'string' ? document.getElementById(input) : input;
    dropdown = typeof dropdown === 'string' ? document.getElementById(dropdown) : dropdown;
    if (!input || !dropdown) return;
    var tags = [];
    var hideTimer;
    var highlightIdx = -1;
    var skipInputClear = false;

    function setHighlight(idx) {

    function setHighlight(idx) {
        var items = dropdown.querySelectorAll('div');
        if (highlightIdx >= 0 && highlightIdx < items.length) {
            items[highlightIdx].style.background = '';
        }
        highlightIdx = idx;
        if (highlightIdx >= 0 && highlightIdx < items.length) {
            items[highlightIdx].style.background = '#f0f2f5';
        }
    }

    function selectItem(idx) {
        var items = dropdown.querySelectorAll('div');
        if (idx >= 0 && idx < items.length) {
            skipInputClear = true;
            input.value = items[idx].getAttribute('data-name');
            var tid = items[idx].getAttribute('data-id');
            if (tid) input.setAttribute('data-tag-id', tid);
            highlightTagInput(input);
            dropdown.style.display = 'none';
            highlightIdx = -1;
            if (onInput) onInput(input);
        }
    }

    function renderDropdown() {
        if (onInput) onInput(input);
        var val = input.value.trim().toLowerCase();
        if (!val) { dropdown.style.display = 'none'; highlightIdx = -1; return; }
        var filtered = tags.filter(function(t) {
            var name = (t.name || '').toLowerCase();
            var path = (t.path || t.name || '').toLowerCase();
            return name.indexOf(val) !== -1 || path.indexOf(val) !== -1;
        });
        if (filtered.length === 0) { dropdown.style.display = 'none'; highlightIdx = -1; return; }
        var html = '';
        filtered.forEach(function(t) {
            html += '<div data-name="' + t.name + '" data-id="' + (t.id || '') + '" style="padding:6px 12px;cursor:pointer;font-size:13px">' + (t.path || t.name) + ' <small style="color:#888">(' + (t.cat || '') + ')</small></div>';
        });
        dropdown.innerHTML = html;
        dropdown.style.display = 'block';
        highlightIdx = -1;
        dropdown.querySelectorAll('div').forEach(function(item, i) {
            item.addEventListener('mouseover', function() { setHighlight(i); });
            item.addEventListener('mouseout', function() { setHighlight(-1); });
            item.addEventListener('click', function() {
                selectItem(i);
            });
        });
    }

    input.addEventListener('input', function() {
        if (skipInputClear) { skipInputClear = false; renderDropdown(); return; }
        input.removeAttribute('data-tag-id');
        unhighlightTagInput(input);
        renderDropdown();
    });
    input.addEventListener('focus', renderDropdown);
    input.addEventListener('blur', function() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() { dropdown.style.display = 'none'; }, 150);
    });
    input.addEventListener('keydown', function(e) {
        var items = dropdown.querySelectorAll('div');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (dropdown.style.display !== 'block') { renderDropdown(); }
            var next = highlightIdx + 1;
            if (next >= items.length) next = 0;
            setHighlight(next);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (dropdown.style.display !== 'block') { renderDropdown(); }
            var prev = highlightIdx - 1;
            if (prev < 0) prev = items.length - 1;
            setHighlight(prev);
        } else if (e.key === 'Enter') {
            if (dropdown.style.display === 'block' && items.length > 0) {
                e.preventDefault();
                var idx = highlightIdx >= 0 ? highlightIdx : 0;
                selectItem(idx);
            }
        } else if (e.key === 'Tab') {
            if (dropdown.style.display === 'block' && items.length > 0) {
                e.preventDefault();
                selectItem(highlightIdx >= 0 ? highlightIdx : 0);
            } else {
                input.removeAttribute('data-tag-id');
            }
        } else if (e.key === 'Escape') {
            dropdown.style.display = 'none';
            highlightIdx = -1;
        }
    });

    function highlightTagInput(el) {
        el.style.background = '#e8f0fe';
        el.style.border = '1px solid #4a90d9';
        el.placeholder = '';
    }
    function unhighlightTagInput(el) {
        el.style.background = '';
        el.style.border = '';
    }

    return {
        setTags: function(t) { tags = t || []; }
    };
}
</script>
{{end}}
