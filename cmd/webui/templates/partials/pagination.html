{{define "pagination"}}
<div class="pagination">
    {{if .PageData.HasPrev}}
        {{if .PageFn}}
            <a href="#" onclick="{{.PageFn}}({{.PageData.PrevPage}});return false">&laquo; 前页</a>
        {{else}}
            <a href="{{.BaseURL}}{{.PageData.PrevPage}}">&laquo; 前页</a>
        {{end}}
    {{else}}
        <span class="disabled">&laquo; 前页</span>
    {{end}}
    <span style="font-size:12px;color:var(--ink-muted)">第 {{.PageData.Page}}/{{.PageData.TotalPages}} 页 ({{.PageData.Total}} 项)</span>
    {{if .PageData.HasNext}}
        {{if .PageFn}}
            <a href="#" onclick="{{.PageFn}}({{.PageData.NextPage}});return false">后页 &raquo;</a>
        {{else}}
            <a href="{{.BaseURL}}{{.PageData.NextPage}}">后页 &raquo;</a>
        {{end}}
    {{else}}
        <span class="disabled">后页 &raquo;</span>
    {{end}}
</div>
{{end}}
