{{define "content"}}
<h2 class="page-title">文件管理</h2>

<div x-data="fileTreePage()">

<div class="card">
    <h3 class="card-title">扫描目录</h3>
    <form id="scan-form" class="form-row mt-md" @submit.prevent="submitScan()">
        <div class="form-group">
            <input name="dir" x-model="scanDir" placeholder="留空为当前目录" style="width:320px">
        </div>
        <button type="submit" class="btn btn-primary" :disabled="scanning" x-text="scanning ? '扫描中...' : '扫描'"></button>
    </form>
</div>

<div class="card">
    <h3 class="card-title">导入文件</h3>
    <form id="import-form" x-ref="importForm" enctype="multipart/form-data" class="form-row mt-md" @submit.prevent="submitImport()">
        <div class="form-group">
            <div style="display:flex;gap:6px">
                <input type="text" name="path" id="import-path" x-model="importPath" placeholder="E:\path\to\file.pdf" style="width:360px">
                <label class="btn btn-default" style="cursor:pointer">
                    <input type="file" name="file" id="import-file" style="display:none" @change="onFilePicked">
                    浏览
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" :disabled="importing" x-text="importing ? '导入中...' : '导入'"></button>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title" style="margin:0">文件列表</h3>
        <div style="display:flex;align-items:center;gap:8px">
            <div class="sort-controls" id="tree-sort-controls">
                <select class="sort-select" id="tree-sort-field" x-model="sortField" @change="changeSort()">
                    <option value="name">名称</option>
                    <option value="size">大小</option>
                    <option value="tagcnt">标签数</option>
                    <option value="type">类型</option>
                </select>
                <button class="sort-order-btn" id="tree-sort-order-btn" @click="toggleOrder()" x-text="orderLabel"></button>
            </div>
            <button class="btn btn-default btn-sm" @click="refreshTree()">刷新目录缓存</button>
        </div>
    </div>
    <div id="file-tree">
        <div class="empty" x-show="loading">
            <div class="empty-icon">&#128196;</div>
            <div class="empty-text">加载中...</div>
        </div>
        <div class="empty" x-show="!loading && error">
            <div class="empty-icon">&#128196;</div>
            <div class="empty-text" x-text="error"></div>
        </div>
        <div class="empty" x-show="!loading && !error && tree.length === 0">
            <div class="empty-icon">&#128196;</div>
            <div class="empty-text">暂无文件</div>
            <div class="empty-hint">请先扫描目录或导入文件</div>
        </div>
        <div class="tree-root" x-show="!loading && !error" x-html="treeHtml()"></div>
    </div>
</div>

</div>

<script src="/static/js/pages/file/tree.js"></script>
{{end}}
