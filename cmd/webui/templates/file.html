{{define "content"}}
<h2 class="page-title">文件管理</h2>

<div class="card">
    <h3 class="card-title">扫描目录</h3>
    <form id="scan-form" class="form-row mt-md">
        <div class="form-group">
            <input name="dir" placeholder="留空为当前目录" style="width:320px">
        </div>
        <button type="submit" class="btn btn-primary">扫描</button>
    </form>
</div>

<div class="card">
    <h3 class="card-title">导入文件</h3>
    <form id="import-form" enctype="multipart/form-data" class="form-row mt-md">
        <div class="form-group">
            <div style="display:flex;gap:6px">
                <input type="text" name="path" id="import-path" placeholder="E:\path\to\file.pdf" style="width:360px">
                <label class="btn btn-default" style="cursor:pointer;align-self:end">
                    <input type="file" name="file" id="import-file" style="display:none" onchange="document.getElementById('import-path').value=this.files[0]?.name||'';document.getElementById('import-path').placeholder=this.files[0]?.name||''">
                    浏览
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">导入</button>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title" style="margin:0">文件列表</h3>
        <button class="btn btn-default btn-sm" onclick="refreshTree()">刷新目录缓存</button>
    </div>
    <div id="file-tree">
        <div class="empty">
            <div class="empty-icon">&#128196;</div>
            <div class="empty-text">加载中...</div>
        </div>
    </div>
</div>

<script src="/static/js/pages/file.js"></script>
{{end}}
