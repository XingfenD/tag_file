{{define "content"}}
<h2 class="page-title"><a href="#" id="groups-back-link">&larr; 返回文件详情</a></h2>

<div class="card">
    <h3 class="card-title">标签组管理: <span id="groups-file-name"></span></h3>
    <p class="text-muted mt-sm"><code><span id="groups-file-path"></span></code></p>
</div>

<div class="card">
    <h3 class="card-title">添加标签组</h3>
    <form id="add-group-form" class="form-row mt-md">
        <input type="hidden" name="file_path" id="groups-file-path-input" value="">
        <div class="form-group">
            <input name="group_name" required placeholder="例如: 版本 v2、临时标记" style="width:220px">
        </div>
        <button type="submit" class="btn btn-primary">添加</button>
    </form>
</div>

<div class="card">
    <h3 class="card-title">标签组列表 (<span id="groups-count">0</span> 个)</h3>
    <div id="groups-content">
        <div class="empty">
            <div class="empty-icon">&#128203;</div>
            <div class="empty-text">加载中...</div>
        </div>
    </div>
</div>

<style>
.g-name { font-weight: 500; }
</style>

<script src="/static/js/api.js"></script>
<script src="/static/js/file.js"></script>
{{end}}
