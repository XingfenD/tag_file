{{define "content"}}
<h2>分类管理</h2>

<div class="card">
    <h3>添加分类</h3>
    <form method="POST" action="/categories/add" class="row">
        <div class="form-group">
            <label>分类名称</label>
            <input name="name" required placeholder="例如: 项目类型">
        </div>
        <div class="form-group">
            <label>描述</label>
            <input name="description" placeholder="可选描述">
        </div>
        <button type="submit" class="btn-primary">添加</button>
    </form>
</div>

<div class="card">
    <h3>分类列表</h3>
    {{if .Categories}}
    <table>
        <thead>
            <tr><th>ID</th><th>名称</th><th>描述</th><th>操作</th></tr>
        </thead>
        <tbody>
            {{range .Categories}}
            <tr>
                <td>{{.CategoryID}}</td>
                <td>{{.CategoryName}}</td>
                <td>{{.Description}}</td>
                <td>
                    <form method="POST" action="/categories/remove" style="display:inline" onsubmit="return confirm('确定删除分类 «{{.CategoryName}}»？\n该分类下的所有标签将被保留。')">
                        <input type="hidden" name="id" value="{{.CategoryID}}">
                        <button type="submit" class="btn-danger btn-sm">删除</button>
                    </form>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p class="empty">暂无分类</p>
    {{end}}
</div>
{{end}}
