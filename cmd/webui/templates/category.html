{{define "content"}}
<h2 class="page-title">分类管理</h2>

<div class="card">
    <h3 class="card-title">添加分类</h3>
    <form id="add-cat-form" class="form-row mt-md">
        <div class="form-group">
            <input name="name" required placeholder="例如: 项目类型" style="width:180px">
        </div>
        <div class="form-group">
            <input name="description" placeholder="可选描述" style="width:240px">
        </div>
        <button type="submit" class="btn btn-primary">添加</button>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title" style="margin:0">分类列表</h3>
    </div>
    <div id="category-list-wrap">
        <form method="GET" action="/categories" class="form-row" style="align-items:end">
            <div class="form-group">
                <input name="q" placeholder="搜索分类..." style="width:200px">
            </div>
            <button type="submit" class="btn btn-default btn-sm">搜索</button>
            <a href="/categories" class="btn btn-ghost btn-sm" style="display:none" id="cat-clear-btn">清除</a>
        </form>
    </div>
    <div id="category-list"></div>
</div>

<script src="/static/js/pages/category/main.js"></script>
<script src="/static/js/pages/category/crud.js"></script>
{{end}}
