{{define "content"}}
<h2>分类管理</h2>

<div class="card">
    <h3>添加分类</h3>
    <form method="POST" action="/categories/add" class="row">
        <div class="form-group">
            <label>分类名称</label>
            <input name="name" required placeholder="例如: 项目类型">
        </div>
        <div class="form-group">
            <label>描述</label>
            <input name="description" placeholder="可选描述">
        </div>
        <button type="submit" class="btn-primary">添加</button>
        <input type="hidden" name="_return" value="q={{.Query}}">
    </form>
</div>

<div class="card">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
        <h3 style="margin:0">分类列表</h3>
        <form method="GET" action="/categories" class="row" style="flex:1;justify-content:flex-end">
            <div class="form-group">
                <input name="q" placeholder="搜索分类..." value="{{.Query}}" style="width:200px">
            </div>
            <button type="submit" class="btn-default btn-sm">搜索</button>
            {{if .Query}}<a href="/categories" class="btn-default btn-sm" style="text-decoration:none">清除</a>{{end}}
        </form>
    </div>
    {{if .Categories}}
    <table>
        <thead>
            <tr><th>ID</th><th>名称</th><th>描述</th><th>操作</th></tr>
        </thead>
        <tbody>
            {{range .Categories}}
            <tr id="cat-{{.CategoryID}}">
                <td>{{.CategoryID}}</td>
                <td class="cat-name">{{.CategoryName}}</td>
                <td class="cat-desc">{{.Description}}</td>
                <td>
                    <button class="btn-default btn-sm" onclick="editCategory({{.CategoryID}},'{{.CategoryName}}','{{.Description}}')">编辑</button>
                    <form method="POST" action="/categories/remove" style="display:inline" onsubmit="return confirm('确定删除分类 «{{.CategoryName}}»？')">
                        <input type="hidden" name="id" value="{{.CategoryID}}">
                        <input type="hidden" name="_return" value="q={{$.Query}}">
                        <button type="submit" class="btn-danger btn-sm">删除</button>
                    </form>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{template "pagination" .}}
    {{else}}
    {{template "empty" "暂无分类"}}
    {{end}}
</div>

<script>
function editCategory(id, name, desc) {
    var cells = document.querySelectorAll('#cat-'+id+' td');
    cells[1].innerHTML = '<input id="edit_cat_name_'+id+'" value="'+name+'" required style="width:120px">';
    cells[2].innerHTML = '<input id="edit_cat_desc_'+id+'" value="'+(desc||'')+'" style="width:150px">';
    cells[3].innerHTML = '<button class="btn-primary btn-sm" onclick="saveCategory('+id+')">保存</button> <button type="button" class="btn-default btn-sm" onclick="location.reload()">取消</button>';
}

function saveCategory(id) {
    var name = document.getElementById('edit_cat_name_'+id).value;
    var desc = document.getElementById('edit_cat_desc_'+id).value;
    var body = 'id='+encodeURIComponent(id)+'&name='+encodeURIComponent(name)+'&description='+encodeURIComponent(desc);
    fetch('/categories/update', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
        .then(function(){ location.reload(); });
}
</script>
{{end}}
