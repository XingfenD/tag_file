{{define "content"}}
<h2 class="page-title">标签搜索</h2>

<div class="card">
    <h3 class="card-title">搜索条件</h3>
    <div id="query-builder"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-default" id="add-condition-btn">+ 添加条件</button>
        <button class="btn btn-default" id="add-group-btn">+ 添加分组</button>
        <button class="btn btn-primary" id="search-btn">搜索</button>
    </div>
    <div id="search-history"></div>
</div>

<div id="search-results"></div>

<script src="/static/js/pages/search/builder.js"></script>
<script src="/static/js/pages/search/main.js"></script>
{{end}}
