{{define "content"}}
<h2 class="page-title">标签搜索</h2>

<div x-data="searchPage()">

<div class="card">
    <h3 class="card-title">搜索条件</h3>
    <div id="query-builder" x-html="builderHtml"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-default" id="add-condition-btn" @click="addRowTo(root, '')">+ 添加条件</button>
        <button class="btn btn-default" id="add-group-btn" @click="addTopGroup()">+ 添加分组</button>
        <button class="btn btn-primary" id="search-btn" :disabled="searching" x-text="searching ? '搜索中...' : '搜索'" @click="doSearch(1)"></button>
    </div>
    <div id="search-history">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px" x-show="history.length > 0">
            <span class="text-muted" style="font-size:12px">最近搜索</span>
            <a href="#" class="btn-ghost" style="font-size:11px" @click.prevent="clearHistory()">清除</a>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
            <template x-for="h in history" :key="h.raw">
                <a href="#" class="tag" style="cursor:pointer;text-decoration:none;font-size:12px"
                   @click.prevent="useHistory(h)" x-text="h.summary"></a>
            </template>
        </div>
    </div>
</div>

<div id="search-results">
    <div class="empty" x-show="!searched">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">添加条件开始搜索</div>
        <div class="empty-hint">支持文件名、标签、标签值、文件大小、类型、日期组合</div>
    </div>
    <div class="empty" x-show="searched && results.length === 0">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">未找到匹配文件</div>
        <div class="empty-hint">尝试调整搜索条件</div>
    </div>
    <div class="card" x-show="searched && results.length > 0">
        <h3 class="card-title" x-text="'搜索结果 (' + pagination.total + ' 个文件)'"></h3>
        <template x-for="item in results" :key="item.file.id">
            <div class="result-item" style="padding:12px 0;border-bottom:1px solid var(--border)">
                <a :href="'/files/detail/' + encodePath(item.file.path)" style="font-weight:500;font-size:14px" x-text="item.file.name"></a>
                <div class="text-muted" style="font-size:12px;margin-top:4px"
                     x-text="item.file.path + ' · ' + formatSize(item.file.size) + ' · ' + (item.file.type || '未知')"></div>
                <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
                    <template x-for="t in item.tags" :key="t.tag_path">
                        <span class="tag" x-text="t.tag_path"></span>
                    </template>
                </div>
            </div>
        </template>
        <div class="pagination" x-show="pagination.total_pages > 1">
            <a href="#" x-show="pagination.has_prev" @click.prevent="doSearch(pagination.prev_page)">« 上一页</a>
            <span class="disabled" x-show="!pagination.has_prev">« 上一页</span>
            <span style="font-size:12px;color:var(--ink-muted)"
                  x-text="'第 ' + pagination.page + '/' + pagination.total_pages + ' 页 (' + pagination.total + ' 项)'"></span>
            <a href="#" x-show="pagination.has_next" @click.prevent="doSearch(pagination.next_page)">下一页 »</a>
            <span class="disabled" x-show="!pagination.has_next">下一页 »</span>
        </div>
    </div>
</div>

</div>

<script src="/static/js/pages/search/main.js"></script>
{{end}}
