{{define "content"}}
<h2 class="page-title">标签搜索</h2>

<div class="card">
    <h3 class="card-title">搜索条件</h3>
    <form id="search-form" class="form-row mt-md">
        <div class="form-group">
            <label>包含标签（逗号分隔）</label>
            <div class="autocomplete-wrap" style="position:relative">
                <input id="include-input" placeholder="例如: Go源码, 重要" style="width:260px" autocomplete="off">
            </div>
        </div>
        <div class="form-group">
            <label>排除标签（逗号分隔）</label>
            <div class="autocomplete-wrap" style="position:relative">
                <input id="exclude-input" placeholder="例如: 废弃" style="width:260px" autocomplete="off">
            </div>
        </div>
        <div class="form-group">
            <label>逻辑</label>
            <select id="logic-select">
                <option value="and">AND (同时包含)</option>
                <option value="or">OR (包含任一)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
    </form>
    <div id="search-history"></div>
</div>

<div id="search-results"></div>

<script src="/static/js/pages/search/main.js"></script>
{{end}}
