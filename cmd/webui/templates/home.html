{{define "content"}}
<h2 class="page-title">首页</h2>

<div class="stats" x-data="homePage()">
    <div class="panel stat-card">
        <div class="num"><span x-text="files">-</span></div>
        <div class="label">{{template "icon" (dict "Name" "file")}} 已索引文件</div>
    </div>
    <div class="panel stat-card">
        <div class="num"><span x-text="categories">-</span></div>
        <div class="label">{{template "icon" (dict "Name" "layers")}} 分类标签</div>
    </div>
    <div class="panel stat-card">
        <div class="num"><span x-text="tags">-</span></div>
        <div class="label">{{template "icon" (dict "Name" "tag")}} 标签总数</div>
    </div>
    <div class="panel stat-card">
        <div class="num"><span x-text="configs">-</span></div>
        <div class="label">{{template "icon" (dict "Name" "settings")}} 配置项</div>
    </div>
</div>

<script src="/static/js/pages/home/main.js"></script>
{{end}}
