{{define "content"}}
<h2 class="page-title">标签管理</h2>

<div class="detail-layout" style="align-items:stretch;min-height:520px">
    <!-- Left: Category Filter Sidebar -->
    <aside class="dir-sidebar-static">
        <div class="dir-header">
            <h4>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--accent)" style="vertical-align:middle;margin-right:4px"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                分类筛选
            </h4>
        </div>
        <div class="dir-section">
            <ul id="side-category-list" class="dir-file-list">
                <li class="text-muted" style="padding:8px 16px;font-size:12px">加载中...</li>
            </ul>
        </div>
    </aside>

    <!-- Right: Content Area -->
    <div class="tag-content-panel">
        <!-- Controls -->
        <div class="flex-between mb-md">
            <div class="segmented" id="view-toggle">
                <button id="view-tree-btn" onclick="switchView('tree')" class="active">树形</button>
                <button id="view-flat-btn" onclick="switchView('flat')">平铺</button>
            </div>
            <form id="tag-search-form" class="form-row" style="align-items:end">
                <input name="q" id="search-q" placeholder="搜索标签..." style="width:200px">
                <button type="submit" class="btn btn-default">搜索</button>
                <button type="button" id="clear-search-btn" class="btn btn-ghost" style="display:none" onclick="clearSearch()">清除</button>
            </form>
        </div>

        <!-- Content -->
        <div id="tag-list-wrap">
            <div class="empty">
                <div class="empty-icon">&#127991;</div>
                <div class="empty-text">加载中...</div>
            </div>
        </div>

        <!-- Inline Add -->
        <div class="inline-add">
            <form id="add-tag-form-inline" class="form-row" style="width:100%;align-items:end">
                <div class="form-group">
                    <label>标签名</label>
                    <input name="tag_name" required placeholder="例如: 作者" style="width:120px">
                </div>
                <div class="form-group" style="position:relative">
                    <label>父标签（可选）</label>
                    <input name="parent_tag_name" id="parent_tag_select" placeholder="搜索..." autocomplete="off" style="width:140px">
                    <div id="parent-tag-dropdown" class="dropdown"></div>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select name="category_id" id="add-category" onchange="loadParentTagsForAdd(this.value)" required style="width:130px">
                        <option value="">选择分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <input name="description" placeholder="可选" style="width:140px">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>
</div>

<script src="/static/js/pages/tag/main.js"></script>
<script src="/static/js/pages/tag/sidebar.js"></script>
<script src="/static/js/pages/tag/list-tree.js"></script>
<script src="/static/js/pages/tag/list-flat.js"></script>
<script src="/static/js/pages/tag/values.js"></script>
<script src="/static/js/pages/tag/crud.js"></script>
<script src="/static/js/pages/tag/drag-drop.js"></script>
{{end}}
