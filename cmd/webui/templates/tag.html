{{define "content"}}
<h2 class="page-title">标签管理</h2>

<div class="card" style="padding:0;display:flex;overflow:hidden;min-height:520px">
    <!-- Left: Tag Tree Panel -->
    <div class="tag-tree-panel" style="width:240px">
        <div class="tag-tree-panel-title">分类标签树</div>
        <div style="padding:0 14px 10px">
            <input id="tree-filter" placeholder="筛选..." style="width:100%;font-size:11px;padding:4px 8px" oninput="filterTree()">
        </div>
        <ul class="tag-tree-list" id="side-tree">
            <li class="text-muted" style="padding:8px 14px;font-size:12px">加载中...</li>
        </ul>
    </div>

    <!-- Right: Content Area -->
    <div style="flex:1;padding:22px 24px;overflow-y:auto;border-left:1px solid var(--border)">
        <!-- Controls -->
        <div class="flex-between mb-md">
            <div class="segmented" id="view-toggle">
                <button id="view-tree-btn" onclick="switchView('tree')" class="active">树形</button>
                <button id="view-flat-btn" onclick="switchView('flat')">平铺</button>
            </div>
            <form onsubmit="return doSearch(this)" class="form-row" style="align-items:end">
                <select name="category_id" id="search-category" style="width:130px" onchange="doSearch(this.form)">
                    <option value="">所有分类</option>
                </select>
                <input name="q" id="search-q" placeholder="搜索标签..." style="width:160px">
                <button type="submit" class="btn btn-default btn-sm">搜索</button>
                <button type="button" id="clear-search-btn" class="btn btn-ghost btn-sm" style="display:none" onclick="clearSearch()">清除</button>
            </form>
        </div>

        <!-- Content -->
        <div id="tag-list-wrap">
            <div class="empty">
                <div class="empty-icon">&#127991;</div>
                <div class="empty-text">加载中...</div>
            </div>
        </div>

        <!-- Inline Add -->
        <div class="inline-add">
            <form onsubmit="return submitAddTag(this)" class="form-row" style="width:100%;align-items:end">
                <div class="form-group">
                    <label>标签名</label>
                    <input name="tag_name" required placeholder="例如: 作者" style="width:120px">
                </div>
                <div class="form-group" style="position:relative">
                    <label>父标签（可选）</label>
                    <input name="parent_tag_name" id="parent_tag_select" placeholder="搜索..." autocomplete="off" style="width:140px">
                    <div id="parent-tag-dropdown" class="dropdown"></div>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select name="category_id" id="add-category" onchange="loadParentTagsForAdd(this.value)" required style="width:130px">
                        <option value="">选择分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <input name="description" placeholder="可选" style="width:140px">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>
</div>

<style>
.tag-tree-node { list-style: none; }
.tag-tree-row-main { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 13px; border-radius: var(--radius-sm); transition: background var(--transition); cursor: default; }
.tag-tree-row-main .tag-tree-name { font-weight: 500; color: var(--ink); }
.tag-tree-row-main .tree-actions { opacity: 0; transition: opacity 0.15s ease; display: inline-flex; gap: 2px; align-items: center; flex-shrink: 0; }
.tag-tree-row-main:hover .tree-actions { opacity: 1; }
.tag-tree-row-main:hover .drag-handle { opacity: 1; }
.tag-tree-row-main:hover { background: var(--accent-bg); }

/* drag and drop */
.tag-tree-row-main.drag-over { background: var(--accent-bg); outline: 2px dashed var(--accent); outline-offset: -2px; }
.drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.85; background: var(--paper-white); border: 1px solid var(--accent); padding: 4px 12px; font-size: 12px; font-weight: 500; color: var(--accent); box-shadow: var(--shadow-md); white-space: nowrap; }
body.tag-dragging .tag-tree-row-main { cursor: grabbing; }
body.tag-dragging .tag-tree-row-main[data-dragging] { opacity: 0.3; }

/* table hover actions */
.col-actions-inner { opacity: 0; transition: opacity 0.15s ease; display: inline-flex; gap: 2px; }
tbody tr:hover .col-actions-inner { opacity: 1; }
</style>
<script src="/static/js/pages/tag.js"></script>
{{end}}
