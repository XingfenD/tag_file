{{define "content"}}
<h2 class="page-title">系统配置</h2>

<div x-data="configPage()" class="config-layout">

<!-- ── 加载守卫：schema 读取完成前整页输入/保存禁用 ── -->
<div class="flash flash-warning config-load-guard" x-show="!schemaLoaded" x-cloak>
    <div><span x-text="schemaLoadError || '配置正在加载中…'"></span></div>
    <div x-show="schemaLoadError">此时下面的输入值不能当作库里已保存的配置（读取还没完成，显示的可能只是内置默认值）；为避免用默认值覆盖真实配置，所有输入与保存已禁用。</div>
    <button type="button" class="btn btn-default btn-sm" x-show="schemaLoadError" @click="loadSchema()">重新加载</button>
</div>

<aside class="panel dir-sidebar">
    <div class="dir-section-title">配置目录</div>
    <nav class="config-nav">
        <template x-for="g in blocks" :key="'nav-' + g.id">
            <a href="#" class="config-nav-item" :class="{active: activeNav === 'config-card-' + g.id}"
               @click.prevent="jumpTo('config-card-' + g.id)">
                <span class="nav-name" x-text="g.title"></span>
                <span class="badge badge-red" x-show="groupInvalidCount(g) > 0" x-cloak x-text="groupInvalidCount(g)"></span>
            </a>
        </template>
        <a href="#" class="config-nav-item" :class="{active: activeNav === 'config-card-export'}"
           @click.prevent="jumpTo('config-card-export')">
            <span class="nav-name">数据导出</span>
        </a>
    </nav>
</aside>

<div class="config-content">
    <!-- ── 按 schema 渲染的配置块卡片 ── -->
    <template x-for="g in blocks" :key="g.id">
        {{template "config_group"}}
    </template>

    <!-- ── 数据导出（原样保留）── -->
    <div class="card" id="config-card-export">
        <h3 class="card-title">数据导出</h3>
        <p class="text-muted mt-sm mb-md">将数据库导出为 SQL 文件，可用于备份或迁移。</p>
        <a href="/api/export" class="btn btn-default">{{template "icon" (dict "Name" "download")}} 导出 SQL 文件</a>
    </div>
</div>

</div>

<script src="/static/js/pages/config/main.js"></script>
{{end}}
