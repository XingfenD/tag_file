{{define "content"}}
<h2 class="page-title">系统配置</h2>

<div x-data="configPage()">

<div class="card" id="config-form-card">
    <h3 class="card-title">添加 / 更新配置</h3>
    <form class="form-row mt-md" id="config-form" @submit.prevent="submitForm()">
        <div class="form-group">
            <input name="key" id="config-key" x-model="cfgKey" required placeholder="配置键，例如: default_editor" style="width:200px">
        </div>
        <div class="form-group">
            <input name="value" id="config-value" x-model="cfgValue" required placeholder="配置值" style="width:300px">
        </div>
        <div class="form-group">
            <input name="description" id="config-desc" x-model="cfgDesc" placeholder="可选描述" style="width:180px">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title" style="margin:0">配置列表</h3>
        <form class="form-row" style="align-items:end" id="config-search-form" @submit.prevent="doSearch()">
            <div class="form-group">
                <input name="q" x-model="queryInput" placeholder="搜索配置..." style="width:200px">
            </div>
            <button type="submit" class="btn btn-default">搜索</button>
            <a href="/config" class="btn btn-ghost" id="config-clear-btn" x-show="q" @click="clearSearch()">清除</a>
        </form>
    </div>
    <div id="config-table-wrap" x-show="items.length > 0">
        <table>
            <thead>
                <tr><th>ID</th><th>键</th><th>值</th><th>描述</th><th style="width:120px">操作</th></tr>
            </thead>
            <tbody id="config-tbody">
                <template x-for="(item, i) in items" :key="item.key">
                    <tr :id="'cfg-' + displayIndex(i)">
                        <td class="col-id" x-text="displayIndex(i)"></td>
                        <td><code x-text="item.key"></code></td>
                        <td class="cfg-val" style="max-width:250px;overflow:hidden;text-overflow:ellipsis" x-text="item.value"></td>
                        <td class="text-muted">—</td>
                        <td class="col-actions">
                            <button class="btn btn-default btn-sm" @click="editConfig(item.key, item.value)">编辑</button>
                            <button class="btn btn-danger btn-sm" @click="removeConfig(item.key)">删除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div id="config-pagination">
            <div class="pagination" x-show="pagination.total_pages > 1">
                <a href="#" x-show="pagination.has_prev" @click.prevent="goToPage(pagination.prev_page)">« 上一页</a>
                <span class="disabled" x-show="!pagination.has_prev">« 上一页</span>
                <span class="page-info" x-text="'第 ' + pagination.page + '/' + pagination.total_pages + ' 页 (共 ' + pagination.total + ' 条)'"></span>
                <a href="#" x-show="pagination.has_next" @click.prevent="goToPage(pagination.next_page)">下一页 »</a>
                <span class="disabled" x-show="!pagination.has_next">下一页 »</span>
            </div>
        </div>
    </div>
    <div id="config-empty" x-show="!loading && items.length === 0">
        <div class="empty-icon">&#9733;</div>
        <div class="empty-text">暂无配置</div>
    </div>
</div>

<div class="card">
    <h3 class="card-title">数据导出</h3>
    <p class="text-muted mt-sm mb-md">将数据库导出为 SQL 文件，可用于备份或迁移。</p>
    <a href="/export" class="btn btn-default">&#128229; 导出 SQL 文件</a>
</div>

</div>

<script src="/static/js/pages/config/main.js"></script>
{{end}}
