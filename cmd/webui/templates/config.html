{{define "content"}}
<h2 class="page-title">系统配置</h2>

<div class="card" id="config-form-card">
    <h3 class="card-title">添加 / 更新配置</h3>
    <form class="form-row mt-md" id="config-form">
        <div class="form-group">
            <input name="key" id="config-key" required placeholder="配置键，例如: default_editor" style="width:200px">
        </div>
        <div class="form-group">
            <input name="value" id="config-value" required placeholder="配置值" style="width:300px">
        </div>
        <div class="form-group">
            <input name="description" id="config-desc" placeholder="可选描述" style="width:180px">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-default btn-sm cancel-btn" style="display:none" onclick="resetConfigForm()">取消</button>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title" style="margin:0">配置列表</h3>
        <form method="GET" action="/config" class="form-row" style="align-items:end" id="config-search-form">
            <div class="form-group">
                <input name="q" placeholder="搜索配置..." style="width:200px">
            </div>
            <button type="submit" class="btn btn-default btn-sm">搜索</button>
            <a href="/config" class="btn btn-ghost btn-sm" id="config-clear-btn" style="display:none">清除</a>
        </form>
    </div>
    <div id="config-table-wrap" style="display:none">
        <table>
            <thead>
                <tr><th>ID</th><th>键</th><th>值</th><th>描述</th><th style="width:120px">操作</th></tr>
            </thead>
            <tbody id="config-tbody"></tbody>
        </table>
        <div id="config-pagination"></div>
    </div>
    <div id="config-empty">
        <div class="empty-icon">&#9733;</div>
        <div class="empty-text">暂无配置</div>
    </div>
</div>

<div class="card">
    <h3 class="card-title">数据导出</h3>
    <p class="text-muted mt-sm mb-md">将数据库导出为 SQL 文件，可用于备份或迁移。</p>
    <a href="/export" class="btn btn-default">&#128229; 导出 SQL 文件</a>
</div>

<script src="/static/js/pages/config.js"></script>
{{end}}
