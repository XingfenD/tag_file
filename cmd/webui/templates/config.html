{{define "content"}}
<h2 class="page-title">系统配置</h2>

<div x-data="configPage()">

<!-- ── 加载守卫：schema 读取完成前整页输入/保存禁用 ── -->
<div class="flash flash-warning" x-show="!schemaLoaded" x-cloak>
    <div><span x-text="schemaLoadError || '配置正在加载中…'"></span></div>
    <div x-show="schemaLoadError">此时下面的输入值不能当作库里已保存的配置（读取还没完成，显示的可能只是内置默认值）；为避免用默认值覆盖真实配置，所有输入与保存已禁用。</div>
    <button type="button" class="btn btn-default btn-sm" x-show="schemaLoadError" @click="loadSchema()">重新加载</button>
</div>

<!-- ── 按 schema 渲染的分组卡片 ── -->
<template x-for="g in groups" :key="g.id">
    <div class="card config-group">
        <div class="config-group-head" @click="toggleCollapse(g.id)">
            <span class="config-group-arrow" x-text="isCollapsed(g.id) ? '▸' : '▾'"></span>
            <h3 class="card-title" x-text="g.title"></h3>
            <span class="config-invalid-badge" x-show="groupInvalidCount(g) > 0" x-cloak
                  x-text="groupInvalidCount(g) + ' 项非法'"></span>
        </div>
        <div class="config-group-body" x-show="!isCollapsed(g.id)">
            <template x-for="f in g.fields" :key="f.key">
                <div class="config-field" :class="{'config-field-invalid': fieldInvalid(f)}" x-show="fieldVisible(f, g)">
                    <div class="config-field-label">
                        <span x-text="f.label"></span>
                        <template x-if="f.description">
                            <span class="info-tip" x-data="infoTip" tabindex="0"
                                  @mouseenter="show()" @mouseleave="hide()"
                                  @focusin="show()" @focusout="hide()" @click="toggle()">
                                <span class="info-tip-mark">ⓘ</span>
                                <span class="info-tip-pop" x-show="open" x-cloak x-text="f.description"></span>
                            </span>
                        </template>
                        <span class="config-field-key" x-text="f.key"></span>
                    </div>

                    <div class="config-field-control">
                        <template x-if="f.type === 'string' || f.type === 'url'">
                            <input type="text" x-model="f.value" :disabled="!schemaLoaded" @input="touch(f)">
                        </template>
                        <template x-if="f.type === 'text'">
                            <textarea x-model="f.value" rows="3" :disabled="!schemaLoaded" @input="touch(f)"></textarea>
                        </template>
                        <template x-if="f.type === 'secret'">
                            <input type="password" x-model="f.value" :disabled="!schemaLoaded"
                                   :placeholder="f.has_value ? '已设置，留空不修改' : ''" @input="touch(f)">
                        </template>
                        <template x-if="f.type === 'int' || f.type === 'float' || f.type === 'duration'">
                            <!-- 不设 min/max/step：浏览器步进网格会误杀合法存量值，边界交给 JS 判定，服务端兜底 -->
                            <input type="number" x-model="f.value" :disabled="!schemaLoaded" @input="touch(f)">
                        </template>
                        <template x-if="f.type === 'bool'">
                            <input type="checkbox" :checked="f.value === 'true'" :disabled="!schemaLoaded"
                                   @change="setBool(f, $event)">
                        </template>
                        <template x-if="f.type === 'enum'">
                            <select x-model="f.value" :disabled="!schemaLoaded" @change="touch(f)">
                                <template x-for="o in f.options" :key="o.value">
                                    <option :value="o.value" x-text="o.label"></option>
                                </template>
                            </select>
                        </template>
                        <template x-if="f.type === 'list'">
                            <div class="config-list">
                                <template x-for="(row, i) in f.rows" :key="i">
                                    <div class="config-list-row">
                                        <input type="text" x-model="f.rows[i]" :disabled="!schemaLoaded"
                                               :class="{'config-row-invalid': !regexRowValid(f, row)}" @input="touch(f)">
                                        <button type="button" class="btn btn-ghost btn-sm" @click="removeRow(f, i)"
                                                :disabled="!schemaLoaded">✕</button>
                                    </div>
                                </template>
                                <button type="button" class="btn btn-default btn-sm config-list-add" @click="addRow(f)"
                                        :disabled="!schemaLoaded">+ 添加</button>
                            </div>
                        </template>
                    </div>

                    <div class="config-field-meta">
                        <span class="config-field-hint" x-show="fieldHint(f)" x-text="fieldHint(f)"></span>
                        <span class="config-field-error" x-show="fieldInvalid(f)" x-cloak x-text="fieldErrorText(f)"></span>
                        <button type="button" class="config-field-reset" @click="resetField(f)" :disabled="!schemaLoaded">恢复默认</button>
                    </div>
                </div>
            </template>

            <div class="config-group-footer">
                <button class="btn btn-primary" :disabled="!schemaLoaded || g.saving || groupInvalidCount(g) > 0"
                        @click="saveGroup(g)" x-text="g.saving ? '保存中...' : '保存'"></button>
                <span class="config-group-block-hint" x-show="groupInvalidCount(g) > 0" x-cloak>组内有非法值，请先修复</span>
            </div>
        </div>
    </div>
</template>

<!-- ── 高级 / 自定义配置（注册表之外的键）── -->
<div class="card">
    <div class="config-group-head" @click="toggleCollapse('advanced')">
        <span class="config-group-arrow" x-text="isCollapsed('advanced') ? '▸' : '▾'"></span>
        <h3 class="card-title">高级 / 自定义配置</h3>
    </div>
    <div x-show="!isCollapsed('advanced')">
        <p class="config-advanced-hint mb-md">未知键不会被程序读取，仅供扩展或调试。</p>

        <form class="form-row" @submit.prevent="submitAdvanced()">
            <div class="form-group">
                <input name="adv-key" x-model="advanced.addKey" :disabled="!schemaLoaded" required
                       placeholder="配置键，例如: default_editor" style="width:200px">
            </div>
            <div class="form-group">
                <input name="adv-value" x-model="advanced.addValue" :disabled="!schemaLoaded" required
                       placeholder="配置值" style="width:300px">
            </div>
            <button type="submit" class="btn btn-primary" :disabled="!schemaLoaded || advanced.adding"
                    x-text="advanced.adding ? '保存中...' : '添加'"></button>
        </form>

        <div class="card-header mt-md">
            <form class="form-row" style="align-items:end" @submit.prevent="searchAdvanced()">
                <div class="form-group">
                    <input name="adv-q" x-model="advanced.queryInput" placeholder="搜索未知键..." style="width:200px">
                </div>
                <button type="submit" class="btn btn-default">搜索</button>
                <a href="#" class="btn btn-ghost" x-show="advanced.q" @click.prevent="clearAdvancedSearch()">清除</a>
            </form>
        </div>

        <div x-show="advanced.items.length > 0">
            <table>
                <thead>
                    <tr><th>ID</th><th>键</th><th>值</th><th style="width:120px">操作</th></tr>
                </thead>
                <tbody>
                    <template x-for="(item, i) in advanced.items" :key="item.key">
                        <tr>
                            <td class="col-id" x-text="advancedIndex(i)"></td>
                            <td style="display:flex;align-items:center;gap:6px">
                                <code class="config-kv-code" x-text="item.key"></code>
                                <template x-if="item.description">
                                    <span class="info-tip" x-data="infoTip" tabindex="0"
                                          @mouseenter="show()" @mouseleave="hide()"
                                          @focusin="show()" @focusout="hide()" @click="toggle()">
                                        <span class="info-tip-mark">ⓘ</span>
                                        <span class="info-tip-pop" x-show="open" x-cloak x-text="item.description"></span>
                                    </span>
                                </template>
                            </td>
                            <td class="text-muted" style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="item.value"></td>
                            <td class="col-actions">
                                <button class="btn btn-default btn-sm" :disabled="!schemaLoaded"
                                        @click="editUnknown(item.key, item.value)">编辑</button>
                                <button class="btn btn-danger btn-sm" :disabled="!schemaLoaded"
                                        @click="removeUnknown(item.key)">删除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div class="pagination" x-show="advanced.pagination.total_pages > 1">
                <a href="#" x-show="advanced.pagination.has_prev" @click.prevent="goAdvancedPage(advanced.pagination.prev_page)">« 上一页</a>
                <span class="disabled" x-show="!advanced.pagination.has_prev">« 上一页</span>
                <span class="current" x-text="advanced.pagination.page"></span>
                <a href="#" x-show="advanced.pagination.has_next" @click.prevent="goAdvancedPage(advanced.pagination.next_page)">下一页 »</a>
                <span class="disabled" x-show="!advanced.pagination.has_next">下一页 »</span>
            </div>
        </div>
        <div x-show="!advanced.loading && advanced.items.length === 0">
            <div class="empty-icon">&#9733;</div>
            <div class="empty-text">暂无未知配置</div>
        </div>
    </div>
</div>

<!-- ── 数据导出（原样保留）── -->
<div class="card">
    <h3 class="card-title">数据导出</h3>
    <p class="text-muted mt-sm mb-md">将数据库导出为 SQL 文件，可用于备份或迁移。</p>
    <a href="/api/export" class="btn btn-default">&#128229; 导出 SQL 文件</a>
</div>

</div>

<script src="/static/js/pages/config/main.js"></script>
{{end}}
