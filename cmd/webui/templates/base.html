{{define "base"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagFile — 文件标签管理器</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/core/variables.css">
    <link rel="stylesheet" href="/static/css/core/base.css">
    <link rel="stylesheet" href="/static/css/layout/layout.css">
    <link rel="stylesheet" href="/static/css/components/buttons.css">
    <link rel="stylesheet" href="/static/css/components/forms.css">
    <link rel="stylesheet" href="/static/css/components/table.css">
    <link rel="stylesheet" href="/static/css/components/tags.css">
    <link rel="stylesheet" href="/static/css/components/notifications.css">
    <link rel="stylesheet" href="/static/css/components/navigation.css">
    <link rel="stylesheet" href="/static/css/components/tree.css">
    <link rel="stylesheet" href="/static/css/core/animations.css">
    <script src="/static/js/core/theme.js"></script>
    <script src="/static/vendor/alpinejs.min.js"></script>
    <script src="/static/vendor/sortable.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><img src="/static/favicon.svg" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:6px">Tag<span>File</span></div>
        <nav>
            <a href="/" class="{{if eq .Active "home"}}active{{end}}">
                <span class="nav-icon">&#9702;</span> 首页
            </a>
            <a href="/categories" class="{{if eq .Active "categories"}}active{{end}}">
                <span class="nav-icon">&#9783;</span> 分类管理
            </a>
            <a href="/tags" class="{{if eq .Active "tags"}}active{{end}}">
                <span class="nav-icon">&#9784;</span> 标签管理
            </a>
            <a href="/files" class="{{if eq .Active "files"}}active{{end}}">
                <span class="nav-icon">&#9776;</span> 文件管理
            </a>
            <a href="/search" class="{{if eq .Active "search"}}active{{end}}">
                <span class="nav-icon">&#9740;</span> 标签搜索
            </a>
            <a href="/config" class="{{if eq .Active "config"}}active{{end}}">
                <span class="nav-icon">&#9733;</span> 系统配置
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="theme-toggle">
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <span class="theme-toggle-icon" id="theme-icon">☀️</span>
                    <span class="theme-toggle-label" id="theme-label">浅色</span>
                </button>
            </div>
            <span>core {{.CoreVersion}} &middot; webui {{.WebuiVersion}}</span>
        </div>
    </aside>
    <div class="main">
        {{template "content" .}}
    </div>
    <div class="modal-overlay" id="confirm-modal" :class="$store.confirm.active && 'active'" @click.self="$store.confirm.cancel()">
        <div class="modal">
            <div class="modal-title">确认操作</div>
            <div class="modal-body" x-text="$store.confirm.msg"></div>
            <div class="modal-actions">
                <button class="btn btn-default" id="confirm-cancel" @click="$store.confirm.cancel()">取消</button>
                <button class="btn btn-danger" id="confirm-ok" @click="$store.confirm.ok()">确认</button>
            </div>
        </div>
    </div>
    <div class="toast-container" id="toast-container">
        <template x-for="(t, i) in $store.toast.items" :key="i">
            <div class="toast" :class="'toast-' + t.type" x-text="t.msg"></div>
        </template>
    </div>
    <script src="/static/vendor/alpinejs.min.js"></script>
    <script src="/static/vendor/sortable.min.js"></script>
    <script src="/static/js/core/stores.js"></script>
    <script src="/static/js/core/components.js"></script>
    <script src="/static/js/core/api.js"></script>
    <script src="/static/js/core/utils.js"></script>
    <script src="/static/js/core/sort-controls.js"></script>
    <script src="/static/js/core/modal.js"></script>
    <script src="/static/js/core/inline-edit.js"></script>
    <script src="/static/js/core/app.js"></script>
</body>
</html>
{{end}}
